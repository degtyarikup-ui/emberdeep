name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Supabase publishable/anon key — safe to embed in a static client
          # bundle by design, this is not a secret.
          VITE_SUPABASE_URL: https://zuqunaizzztxxqzjzkup.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_xbW58NTrCK4U_Z0Nxt_KuA_mLmD0CMd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

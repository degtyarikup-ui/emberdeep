name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pushes made with a GitHub App token (Antigravity, Jules, and other cloud
  # agents) deliberately do NOT fire the `push` event above — GitHub suppresses
  # it to stop workflows retriggering themselves. Without this poll such
  # commits sit on main undeployed, and a broken build goes unnoticed.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Scheduled runs fire whether or not main moved, so skip the ones with
  # nothing new to ship. push/dispatch runs always proceed.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" \
            --jq '.[0].sha // ""')
          echo "main is at ${{ github.sha }}, Pages last deployed $deployed"
          if [ "$deployed" = "${{ github.sha }}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Supabase publishable/anon key — safe to embed in a static client
          # bundle by design, this is not a secret.
          VITE_SUPABASE_URL: https://zuqunaizzztxxqzjzkup.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_xbW58NTrCK4U_Z0Nxt_KuA_mLmD0CMd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

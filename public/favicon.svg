<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181024" />
      <stop offset="50%" stop-color="#0e0817" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="1" />
      <stop offset="25%" stop-color="#ff7a18" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#dc2626" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#7f1d1d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="crystalGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Crest Shield -->
  <path d="M 64,8 C 96,8 116,22 116,56 C 116,92 84,116 64,124 C 44,116 12,92 12,56 C 12,22 32,8 64,8 Z" 
        fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Dark Iron Border -->
  <path d="M 64,16 C 90,16 106,28 106,56 C 106,86 78,106 64,114 C 50,106 22,86 22,56 C 22,28 38,16 64,16 Z" 
        fill="#120c1c" stroke="#312e81" stroke-width="1.5" opacity="0.8" />

  <!-- Fiery Ambient Ember Halo -->
  <circle cx="64" cy="66" r="38" fill="url(#emberGlow)" />

  <!-- Crossed Broadswords Behind Crystal -->
  <!-- Sword 1 (Top-Left to Bottom-Right) -->
  <g transform="rotate(42 64 64)">
    <rect x="62" y="16" width="4" height="74" fill="url(#bladeGrad)" rx="1" />
    <!-- Crossguard -->
    <rect x="52" y="86" width="24" height="4" fill="url(#goldGrad)" rx="1" />
    <!-- Grip & Pommel -->
    <rect x="62.5" y="90" width="3" height="14" fill="#78350f" />
    <circle cx="64" cy="106" r="3.5" fill="url(#goldGrad)" />
  </g>
  <!-- Sword 2 (Top-Right to Bottom-Left) -->
  <g transform="rotate(-42 64 64)">
    <rect x="62" y="16" width="4" height="74" fill="url(#bladeGrad)" rx="1" />
    <!-- Crossguard -->
    <rect x="52" y="86" width="24" height="4" fill="url(#goldGrad)" rx="1" />
    <!-- Grip & Pommel -->
    <rect x="62.5" y="90" width="3" height="14" fill="#78350f" />
    <circle cx="64" cy="106" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Central Molten Ember Diamond / Heart Gem -->
  <g filter="url(#glow)">
    <!-- Outer Runic Diamond -->
    <polygon points="64,36 84,66 64,96 44,66" fill="url(#crystalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Inner Radiant Core -->
    <polygon points="64,44 76,66 64,88 52,66" fill="#fff" opacity="0.6" />
    <!-- Ember Highlights -->
    <polygon points="64,48 71,66 64,80 57,66" fill="#ffedd5" opacity="0.85" />
  </g>

  <!-- Floating Spark Dots -->
  <circle cx="38" cy="40" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="90" cy="42" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="64" cy="24" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="34" cy="74" r="1.2" fill="#f97316" opacity="0.7" />
  <circle cx="94" cy="72" r="1.2" fill="#f97316" opacity="0.7" />
</svg>
